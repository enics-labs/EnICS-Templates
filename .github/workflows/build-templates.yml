# Compiles every template (with and without the guidance text) on each push,
# so a broken template never reaches the students. Runs Utilities/build_all.sh
# inside the full TeX Live image. PDFs are kept as a downloadable artifact.
name: Build all templates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pygments for minted
        run: apt-get update -qq && apt-get install -y -qq python3-pygments
      - name: Build all templates
        run: BUILD_DIR="$PWD/build" bash Utilities/build_all.sh -n
      - name: Keep the PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-pdfs
          path: build/*/main.pdf
          if-no-files-found: ignore
